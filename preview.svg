<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" height="100%">
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #9e9e9e; }
    .window-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #9e9e9e; letter-spacing: 0.3px; }
    .chip-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #b0b0b0; }
  </style>

  <!-- Card Frame (Flat Dark Theme HA Card) -->
  <rect x="20" y="20" width="640" height="260" rx="12" ry="12" fill="#1c1c1e" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Window Header -->
  <path d="M 20 32 A 12 12 0 0 1 32 20 L 648 20 A 12 12 0 0 1 660 32 L 660 48 L 20 48 Z" fill="rgba(255, 255, 255, 0.05)" />
  <line x1="20" y1="48" x2="660" y2="48" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Window Control Dots -->
  <circle cx="40" cy="34" r="4" fill="#ff5f56" />
  <circle cx="53" cy="34" r="4" fill="#ffbd2e" />
  <circle cx="66" cy="34" r="4" fill="#27c93f" />
  <text x="82" y="38" class="window-title">Ingress Card</text>

  <!-- Center Icon (Flat HA Blue) -->
  <rect x="316" y="72" width="48" height="48" rx="12" ry="12" fill="#03a9f4" />
  <!-- Web/Browser Icon -->
  <path d="M346 84 H334 C333 84 332.1 84.8 332.1 85.8 L332 98.2 C332 99.2 332.9 100 334 100 H346 C347.1 100 348 99.2 348 98.2 V85.8 C348 84.8 347.1 84 346 84 Z M346 98.2 H334 V88.5 H346 V98.2 Z M346 86.8 H334 V85.8 H346 V86.8 Z" fill="#ffffff" />

  <!-- Title & Subtitle -->
  <text x="340" y="146" text-anchor="middle" class="title">Ingress Card</text>
  <text x="340" y="168" text-anchor="middle" class="subtitle">Embed any Supervisor add-on or web application with Ingress session support.</text>

  <!-- Chips / Add-on Badges (Flat Subtle Badges) -->
  <g transform="translate(178, 194)">
    <!-- ESPHome Chip -->
    <g transform="translate(0, 0)">
      <rect width="70" height="24" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="35" y="16" text-anchor="middle" class="chip-text">ESPHome</text>
    </g>
    <!-- Node-RED Chip -->
    <g transform="translate(78, 0)">
      <rect width="78" height="24" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="39" y="16" text-anchor="middle" class="chip-text">Node-RED</text>
    </g>
    <!-- Grafana Chip -->
    <g transform="translate(164, 0)">
      <rect width="66" height="24" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="33" y="16" text-anchor="middle" class="chip-text">Grafana</text>
    </g>
    <!-- Zigbee2MQTT Chip -->
    <g transform="translate(238, 0)">
      <rect width="86" height="24" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="43" y="16" text-anchor="middle" class="chip-text">Zigbee2MQTT</text>
    </g>
  </g>
</svg>
